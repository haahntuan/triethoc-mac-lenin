<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trắc Nghiệm Triết Học</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS tạo hình nền Galaxy cố định phía sau */
        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-color: #05070a;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <canvas id="galaxy-canvas"></canvas>
    <canvas id="fireworks"></canvas>

    <div class="app-container">
        <!-- TOP BAR NÚT AVATAR GÓC TRÊN PHẢI -->
        <div class="top-bar">
            <h2 class="app-title">Triết Học Mác - Lênin</h2>
            <div class="top-actions">
                <button id="btn-leaderboard" class="icon-btn-top" title="Bảng xếp hạng">🏆</button>
                <div id="btn-profile" class="profile-circle-btn">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Guest" id="header-avatar" alt="Avatar">
                </div>
            </div>
        </div>

        <!-- Trang chủ -->
        <div id="home-screen" class="screen active">
            <div id="streak-container">
                <div id="fire-icon" class="fire-off">🔥</div>
                <div id="streak-count">0</div>
                <div id="streak-text">streak</div>
            </div>

            <div class="select-container">
                <select id="chapter-select">
                    <option value="5">Làm 5 Câu</option> 
                    <option value="10">Làm 10 Câu</option>
                    <option value="20">Làm 20 Câu</option>
                </select>
            </div>
            <button id="start-btn" class="btn primary-btn">Bắt Đầu Làm Bài</button>
        </div>

        <!-- Trang thi -->
        <div id="quiz-screen" class="screen">
            <div id="back-btn" class="back-btn">&lt;/</div>

            <div class="header">
                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
            
            <div class="flip-wrapper">
                <div id="quiz-content" class="flip-container">
                    <h2 id="question-text">Nội dung câu hỏi?</h2>
                    <div id="options-container"></div>
                </div>
            </div>
        </div>

        <!-- Thanh trạng thái dưới cùng -->
        <div id="bottom-feedback" class="feedback-bar hidden">
            <div class="feedback-content">
                <div id="feedback-icon" class="icon-box">🎉</div>
                <div id="feedback-text">Đúng</div>
            </div>
            <button id="next-btn" class="btn next-btn">Tiếp tục</button>
        </div>

        <!-- Trang kết quả -->
        <div id="result-screen" class="screen">
            <h2>Hoàn Thành!</h2>
            <div class="score-circle"><span id="score-text">0</span></div>
            <p id="feedback-result">Bạn làm đúng 0/10 câu.</p>
            <button id="restart-btn" class="btn primary-btn">Làm Lại</button>
        </div>
    </div>

    <!-- OVERLAY & MODAL PROFILE -->
    <div id="overlay" class="overlay hidden"></div>

    <!-- Panel Chưa Đăng Nhập / Đăng Ký riêng biệt -->
    <div id="auth-sheet" class="bottom-sheet hidden">
        <div class="auth-header-row">
            <div class="auth-tabs">
                <button id="auth-tab-login" class="auth-tab active" type="button">Đăng Nhập</button>
                <button id="auth-tab-register" class="auth-tab" type="button">Đăng Ký</button>
            </div>
            <button class="close-btn close-sheet-btn" type="button">✕</button>
        </div>
        <p id="auth-subtitle" class="sheet-sub">Đăng nhập tài khoản để lưu điểm lên BXH</p>
        
        <div class="form-group" style="margin-top:15px;">
            <input type="text" id="username-input" class="input-field" placeholder="Tên tài khoản (viết liền, không dấu)" autocomplete="off">
            <input type="password" id="password-input" class="input-field" placeholder="Mật khẩu" autocomplete="off">
            <button id="login-btn" class="btn primary-btn">Đăng Nhập</button>
        </div>
    </div>

    <!-- Panel Profile -->
    <div id="profile-sheet" class="bottom-sheet hidden">
        <button class="close-btn close-sheet-btn">✕</button>
        
        <div class="profile-hero">
            <div class="large-avatar-wrapper" id="avatar-click-zone" title="Bấm để đổi ảnh đại diện">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Guest" id="sheet-avatar" alt="Avatar">
                <div class="avatar-edit-overlay">📷</div>
            </div>
            <div id="sheet-handle" class="profile-handle">@guest</div>
            <h3 id="sheet-username">Tuan Tuan Tuan</h3>
            <span class="user-badge-tag">Học viên Triết Học</span>
        </div>

        <div class="profile-actions-list">
            <div class="edit-name-box">
                <input type="text" id="change-name-input" class="input-field" placeholder="Đổi tên hiển thị...">
                <button id="save-name-btn" class="btn primary-btn btn-sm">Đổi Tên</button>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-val" id="stat-streak">0 🔥</span>
                    <span class="stat-lbl">Streak hiện tại</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-best">0 🏆</span>
                    <span class="stat-lbl">Streak kỷ lục</span>
                </div>
            </div>

            <button id="logout-btn" class="btn danger-btn">Đăng Xuất</button>
        </div>
        <input type="file" id="avatar-upload" accept="image/*" style="display:none;">
    </div>

    <!-- Bảng Xếp Hạng -->
    <div id="leaderboard-modal" class="modal-card hidden">
        <div class="modal-header">
            <h3>🏆 Bảng Xếp Hạng</h3>
            <button class="close-btn close-sheet-btn">✕</button>
        </div>

        <div class="rank-tabs">
            <button class="rank-tab active" data-tab="rank-streak">🔥 Theo Streak</button>
            <button class="rank-tab" data-tab="rank-time">⏱️ Theo Thời Gian</button>
        </div>

        <div id="rank-streak" class="rank-tab-content active">
            <div id="streak-rank-list" class="rank-scroll-list"></div>
        </div>

        <div id="rank-time" class="rank-tab-content hidden">
            <div class="time-subtabs">
                <button class="subtab active" data-time="5">5 Câu</button>
                <button class="subtab" data-time="10">10 Câu</button>
                <button class="subtab" data-time="15">15 Câu</button>
            </div>
            <div id="time-rank-list" class="rank-scroll-list"></div>
        </div>
    </div>

    <!-- Thư viện Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
